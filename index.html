<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10243d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DLP Priority" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />

  <title>DLP Priority · Disneyland Paris</title>
  <style>
    :root {
      --night: #10152b;
      --night-2: #171d39;
      --ink: #1d2033;
      --muted: #777b8d;
      --line: #e7e6ec;
      --paper: #fffdfa;
      --cream: #f4efe7;
      --coral: #e98372;
      --coral-dark: #c85e62;
      --lilac: #d8c9ff;
      --sky: #bce4ed;
      --gold: #e2b56d;
      --mint: #bfe2ce;
      --shadow: 0 24px 70px rgba(22, 17, 44, .15);
      --radius: 24px;
    }
    * { box-sizing: border-box; }
    html { background: var(--cream); }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 11% 12%, rgba(216,201,255,.6), transparent 23rem),
        radial-gradient(circle at 92% 26%, rgba(188,228,237,.52), transparent 24rem),
        var(--cream);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 260px minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100vh; padding: 28px 18px 20px;
      display: flex; flex-direction: column; background: var(--night); color: #fff;
      overflow: hidden;
    }
    .sidebar::before, .sidebar::after { content:""; position:absolute; border-radius:50%; border:1px solid rgba(255,255,255,.10); pointer-events:none; }
    .sidebar::before { width: 360px; height: 360px; left: -210px; bottom: -40px; }
    .sidebar::after { width: 270px; height: 270px; right: -180px; top: 220px; }
    .brand { position: relative; display:flex; gap:12px; align-items:center; padding: 2px 10px 28px; }
    .brand-mark { width:38px; height:38px; border-radius: 13px 13px 13px 4px; background: linear-gradient(140deg, var(--coral), #f0bd7c); display:grid; place-items:center; color:var(--night); box-shadow: 0 10px 22px rgba(233,131,114,.24); }
    .brand-mark svg { width: 21px; height: 21px; }
    .brand-name { font-family: Georgia, "Times New Roman", serif; font-size:22px; letter-spacing:-.03em; }
    .brand-kicker { color: #aeb2c8; font-size:10px; letter-spacing:.14em; text-transform:uppercase; margin-top:2px; }
    .nav-title { color:#6d7393; text-transform:uppercase; letter-spacing:.14em; font-size:10px; font-weight:700; padding: 9px 12px 8px; }
    .nav { position:relative; display:grid; gap:5px; }
    .nav button { border:0; background:transparent; color:#bcc0d2; display:flex; align-items:center; gap:12px; text-align:left; padding: 12px 12px; border-radius:14px; transition:.2s; }
    .nav button:hover, .nav button.active { background: rgba(255,255,255,.10); color:#fff; }
    .nav button.active { box-shadow: inset 3px 0 0 var(--coral); }
    .nav svg { width:18px; height:18px; opacity:.9; }
    .nav-count { margin-left:auto; color:#a3a8c1; font-size:12px; }
    .side-spacer { flex:1; }
    .ios-note { position:relative; border:1px solid rgba(255,255,255,.11); background:rgba(255,255,255,.055); border-radius:18px; padding:14px; color:#c8cada; font-size:12px; line-height:1.45; }
    .ios-note strong { color:#fff; font-size:12px; display:block; margin-bottom:4px; }
    .side-user { position:relative; display:flex; gap:10px; align-items:center; padding:18px 9px 0; color:#dfe1eb; }
    .avatar { display:grid; place-items:center; width:31px; height:31px; border-radius:50%; background:var(--lilac); color:var(--night); font-size:11px; font-weight:800; }
    .side-user span { font-size:12px; }
    main { min-width:0; padding: 34px clamp(20px, 4vw, 58px) 54px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom: 38px; }
    .eyebrow { color:var(--coral-dark); text-transform:uppercase; letter-spacing:.18em; font-size:11px; font-weight:800; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size:clamp(34px, 4vw, 52px); letter-spacing:-.055em; line-height:1; margin:9px 0 0; font-weight:500; }
    .top-actions { display:flex; gap:10px; align-items:center; }
    .icon-button, .ghost-button, .primary-button { border:1px solid var(--line); background:rgba(255,255,255,.68); color:var(--ink); border-radius:13px; min-height:42px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 14px; transition: transform .18s, box-shadow .18s, background .18s; }
    .icon-button { width:42px; padding:0; }
    .icon-button:hover, .ghost-button:hover, .primary-button:hover { transform:translateY(-1px); box-shadow:0 8px 18px rgba(30,28,55,.09); }
    .icon-button svg, .ghost-button svg, .primary-button svg { width:17px; height:17px; }
    .primary-button { border-color:transparent; background:var(--night); color:#fff; font-weight:700; }
    .primary-button:hover { background:#252c52; }
    .hero-card { position:relative; overflow:hidden; min-height:264px; border-radius:30px; padding: 30px 33px; background:var(--night); color:white; box-shadow:var(--shadow); display:flex; justify-content:space-between; gap:30px; }
    .hero-card::before { content:""; position:absolute; width:490px; height:490px; right:-190px; top:-295px; border:1px solid rgba(255,255,255,.13); border-radius:50%; box-shadow: 0 0 0 34px rgba(255,255,255,.025), 0 0 0 68px rgba(255,255,255,.025), 0 0 0 102px rgba(255,255,255,.025); }
    .hero-card::after { content:"✦  ·  ✦   ·   ✧     ·   ✦"; position:absolute; right:32px; bottom:30px; color:rgba(255,255,255,.28); letter-spacing:13px; font-size:14px; white-space:nowrap; transform:rotate(-10deg); }
    .hero-copy { position:relative; z-index:1; max-width:520px; }
    .hero-label { display:inline-flex; align-items:center; gap:8px; color:var(--lilac); text-transform:uppercase; letter-spacing:.16em; font-size:10px; font-weight:800; }
    .pulse { width:7px; height:7px; background:var(--coral); border-radius:50%; box-shadow:0 0 0 5px rgba(233,131,114,.15); }
    .hero-card h2 { font-family:Georgia, "Times New Roman", serif; font-size:clamp(29px, 3.7vw, 47px); letter-spacing:-.055em; line-height:1.05; font-weight:500; margin:20px 0 11px; max-width:490px; }
    .hero-card p { color:#b9bed4; margin:0; font-size:14px; line-height:1.55; max-width:420px; }
    .hero-stat { position:relative; z-index:1; align-self:center; flex:0 0 auto; min-width:200px; padding:21px 22px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.07); border-radius:22px; }
    .hero-stat-label { color:#aeb4cc; font-size:11px; text-transform:uppercase; letter-spacing:.14em; }
    .hero-stat-time { display:block; font-size:42px; letter-spacing:-.08em; margin:9px 0 5px; font-weight:650; }
    .hero-stat-meta { display:flex; align-items:center; gap:6px; color:#e7e9f3; font-size:12px; }
    .hero-stat-meta svg { width:14px; color:var(--coral); }
    .section-head { display:flex; justify-content:space-between; align-items:end; gap:20px; margin:42px 0 17px; }
    .section-head h3 { margin:0; font-family:Georgia, "Times New Roman", serif; font-size:26px; font-weight:500; letter-spacing:-.04em; }
    .section-head p { margin:5px 0 0; color:var(--muted); font-size:13px; }
    .view-toggle { display:flex; border:1px solid var(--line); background:rgba(255,255,255,.58); border-radius:11px; padding:3px; }
    .view-toggle button { border:0; background:transparent; border-radius:8px; width:34px; height:30px; color:var(--muted); display:grid; place-items:center; }
    .view-toggle button.active { background:#fff; color:var(--ink); box-shadow:0 2px 8px rgba(40,30,60,.08); }
    .view-toggle svg { width:16px; }
    .cards { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:18px; }
    .priority-card { position:relative; overflow:hidden; background:var(--paper); border-radius:var(--radius); border:1px solid rgba(60,45,75,.08); box-shadow:0 7px 26px rgba(34,25,58,.07); transition: transform .2s, box-shadow .2s; }
    .priority-card:hover { transform:translateY(-3px); box-shadow:0 16px 35px rgba(34,25,58,.12); }
    .priority-card::after { content:""; position:absolute; top:0; bottom:0; left:31px; border-left:1px dashed rgba(88,83,111,.18); pointer-events:none; }
    .card-top { padding:19px 19px 13px 50px; display:flex; justify-content:space-between; align-items:start; }
    .park-tag { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.12em; font-weight:800; }
    .park-dot { width:7px; height:7px; border-radius:50%; background:var(--coral); }
    .card-menu { border:0; background:transparent; color:#9294a2; padding:1px; }
    .card-menu svg { width:18px; }
    .attraction { padding:0 19px 0 50px; min-height:88px; }
    .attraction h4 { margin:0 0 6px; font-family:Georgia, "Times New Roman", serif; font-size:25px; line-height:1.03; letter-spacing:-.045em; font-weight:500; }
    .attraction p { margin:0; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px; }
    .attraction p svg { width:13px; }
    .return-band { margin-top:15px; padding:16px 19px 17px 50px; background:#f6f4fa; border-top:1px solid #ebe8f0; border-bottom:1px solid #ebe8f0; display:flex; justify-content:space-between; align-items:center; gap:9px; }
    .return-label { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.13em; font-weight:800; }
    .return-time { margin-top:4px; font-size:26px; letter-spacing:-.05em; font-weight:750; }
    .return-date { color:var(--muted); font-size:11px; margin-top:3px; }
    .countdown { text-align:right; }
    .countdown strong { color:var(--coral-dark); font-size:13px; white-space:nowrap; }
    .countdown span { display:block; color:var(--muted); font-size:10px; margin-top:3px; }
    .card-footer { display:flex; justify-content:space-between; align-items:center; padding:14px 19px 16px 50px; }
    .notify-state { color:#5e806f; font-size:11px; display:flex; align-items:center; gap:6px; }
    .notify-state.off { color:#9b9aa4; }
    .notify-state svg { width:14px; }
    .card-actions { display:flex; gap:5px; }
    .small-action { border:0; background:transparent; color:#77798a; width:29px; height:29px; border-radius:8px; display:grid; place-items:center; }
    .small-action:hover { background:#f0eef5; color:var(--ink); }
    .small-action svg { width:15px; }
    .add-card { min-height:268px; border:1.5px dashed #c9c5d2; border-radius:var(--radius); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:#747487; background:rgba(255,255,255,.2); transition:.2s; }
    .add-card:hover { border-color:var(--coral); background:rgba(255,255,255,.45); transform:translateY(-2px); }
    .add-card-icon { width:44px; height:44px; border-radius:15px; background:#fff; color:var(--coral-dark); display:grid; place-items:center; box-shadow:0 7px 18px rgba(35,22,51,.08); }
    .add-card-icon svg { width:21px; }
    .add-card strong { font-size:13px; color:var(--ink); }
    .add-card span { font-size:11px; }
    .bottom-grid { display:grid; grid-template-columns: 1.22fr .78fr; gap:18px; margin-top:31px; }
    .panel { background:rgba(255,255,255,.68); border:1px solid rgba(60,45,75,.08); border-radius:22px; padding:20px; }
    .panel-title { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:17px; }
    .panel-title h3 { font-family:Georgia, "Times New Roman", serif; font-size:20px; font-weight:500; letter-spacing:-.03em; margin:0; }
    .panel-title a { color:var(--coral-dark); text-decoration:none; font-size:11px; font-weight:750; }
    .activity-list { display:grid; gap:12px; }
    .activity { display:flex; align-items:center; gap:11px; }
    .activity-icon { width:32px; height:32px; border-radius:11px; background:#eee9ff; color:#7666ad; display:grid; place-items:center; flex:0 0 auto; }
    .activity-icon.coral { background:#fae6e0; color:var(--coral-dark); }
    .activity-icon.sky { background:#e0f3f4; color:#4c929b; }
    .activity-icon svg { width:15px; }
    .activity-copy { min-width:0; flex:1; }
    .activity-copy strong { display:block; font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .activity-copy span { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
    .activity-time { color:var(--muted); font-size:10px; white-space:nowrap; }
    .tip { background:var(--night); color:#fff; overflow:hidden; position:relative; }
    .tip::after { content:"✦"; position:absolute; right:-5px; top:-15px; color:rgba(255,255,255,.10); font-size:125px; line-height:1; }
    .tip .panel-title { position:relative; z-index:1; }
    .tip .panel-title h3 { color:#fff; }
    .tip-text { position:relative; z-index:1; color:#bfc4d8; font-size:12px; line-height:1.55; margin:0; max-width:290px; }
    .tip-link { position:relative; z-index:1; display:inline-flex; align-items:center; gap:6px; margin-top:18px; color:var(--lilac); font-size:11px; font-weight:750; border:0; padding:0; background:transparent; }
    .tip-link svg { width:14px; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(16,21,43,.48); backdrop-filter:blur(7px); display:none; align-items:center; justify-content:center; padding:20px; z-index:20; }
    .modal-backdrop.show { display:flex; }
    .modal { background:var(--paper); width:min(475px,100%); border-radius:26px; box-shadow:0 25px 80px rgba(10,13,28,.3); padding:25px; animation:pop .22s ease-out; }
    @keyframes pop { from { opacity:0; transform:translateY(9px) scale(.98); } to { opacity:1; transform:none; } }
    .modal-head { display:flex; justify-content:space-between; align-items:start; gap:15px; margin-bottom:20px; }
    .modal-head h3 { margin:0; font-family:Georgia, "Times New Roman", serif; font-size:28px; font-weight:500; letter-spacing:-.05em; }
    .modal-head p { margin:6px 0 0; color:var(--muted); font-size:12px; }
    .close { border:0; background:#f1eff4; color:#6d6c79; width:32px; height:32px; border-radius:10px; display:grid; place-items:center; }
    .close svg { width:16px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .field { display:grid; gap:7px; }
    .field.full { grid-column:1/-1; }
    .field label { font-size:11px; color:#67697a; font-weight:750; }
    .field input { width:100%; height:44px; border:1px solid #dedbe6; border-radius:12px; padding:0 12px; color:var(--ink); background:#fff; outline:none; }
    .field input:focus { border-color:var(--coral); box-shadow:0 0 0 3px rgba(233,131,114,.15); }
    .check-row { display:flex; align-items:center; gap:9px; margin:17px 0 22px; font-size:12px; color:#545667; }
    .check-row input { accent-color:var(--coral-dark); width:17px; height:17px; }
    .form-actions { display:flex; justify-content:flex-end; gap:9px; }
    .toast { position:fixed; right:25px; bottom:25px; background:var(--night); color:#fff; padding:13px 16px; border-radius:14px; box-shadow:0 15px 35px rgba(14,13,30,.25); display:flex; align-items:center; gap:9px; opacity:0; transform:translateY(10px); pointer-events:none; transition:.25s; z-index:30; font-size:12px; }
    .toast.show { opacity:1; transform:none; }
    .toast svg { color:var(--mint); width:17px; }
    .mobile-menu { display:none; }
    @media (max-width: 1100px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .add-card { min-height:268px; } }
    @media (max-width: 780px) {
      .shell { display:block; }
      .sidebar { position:relative; height:auto; padding:15px 16px; flex-direction:row; align-items:center; gap:14px; }
      .brand { padding:0; }
      .brand-name { font-size:19px; }
      .brand-kicker, .nav-title, .nav, .side-spacer, .ios-note, .side-user { display:none; }
      .mobile-menu { display:grid; place-items:center; margin-left:auto; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.08); color:#fff; width:38px; height:38px; border-radius:11px; }
      .mobile-menu svg { width:18px; }
      main { padding:25px 17px 40px; }
      .topbar { margin-bottom:27px; align-items:start; }
      .top-actions .ghost-button { display:none; }
      .hero-card { padding:24px; display:block; min-height:0; }
      .hero-card h2 { font-size:34px; }
      .hero-stat { margin-top:23px; min-width:0; width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px 16px; }
      .hero-stat-time { margin:0; font-size:33px; }
      .hero-stat-label { font-size:9px; }
      .hero-stat-meta { font-size:11px; }
      .hero-card::after { display:none; }
      .section-head { margin-top:31px; }
      .section-head h3 { font-size:23px; }
      .view-toggle { display:none; }
      .cards { grid-template-columns:1fr; }
      .add-card { min-height:130px; flex-direction:row; gap:11px; justify-content:flex-start; padding:0 22px; }
      .add-card-icon { width:37px; height:37px; border-radius:12px; }
      .add-card-copy { display:grid; gap:3px; }
      .bottom-grid { grid-template-columns:1fr; }
    }
    @media (max-width: 420px) { .form-grid { grid-template-columns:1fr; } .field.full { grid-column:auto; } .topbar h1 { font-size:37px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }
    /* DLP Priority redesign: mobile-first park dashboard */
    :root {
      --dlp-ink: #17263b;
      --dlp-navy: #10243d;
      --dlp-blue: #31567b;
      --dlp-coral: #ff735f;
      --dlp-coral-dark: #d9524f;
      --dlp-mint: #c9efdc;
      --dlp-sky: #dceff3;
      --dlp-paper: #ffffff;
      --dlp-bg: #edf3f2;
      --dlp-line: #dfe8e7;
      --dlp-muted: #758293;
      --dlp-shadow: 0 16px 42px rgba(30, 52, 72, .12);
    }
    .shell, .modal-backdrop, body > .toast { display:none !important; }
    body {
      min-width: 320px;
      background: var(--dlp-bg);
      color: var(--dlp-ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #dlpApp { display:block; min-height:100vh; padding-bottom:34px; }
    .dlp-header {
      background: var(--dlp-navy);
      color:#fff;
      padding: max(18px, env(safe-area-inset-top)) 18px 15px;
      position:relative;
      overflow:hidden;
    }
    .dlp-header::after {
      content:"";
      position:absolute;
      width:250px; height:250px; border:1px solid rgba(255,255,255,.11);
      border-radius:50%; right:-105px; top:-158px;
      box-shadow:0 0 0 24px rgba(255,255,255,.025), 0 0 0 48px rgba(255,255,255,.025);
      pointer-events:none;
    }
    .dlp-header-inner { max-width:1120px; margin:auto; display:flex; align-items:center; justify-content:space-between; gap:15px; position:relative; z-index:1; }
    .dlp-brand { display:flex; align-items:center; gap:11px; }
    .dlp-stamp { width:43px; height:43px; border:1px solid rgba(255,255,255,.42); border-radius:14px 14px 14px 4px; display:grid; place-items:center; color:var(--dlp-navy); background:var(--dlp-coral); font-weight:900; font-size:11px; letter-spacing:.04em; box-shadow:5px 5px 0 rgba(255,255,255,.10); }
    .dlp-brand-name { font-family:Georgia, "Times New Roman", serif; font-size:23px; line-height:1; letter-spacing:-.04em; }
    .dlp-brand-sub { color:#aebdd0; font-size:10px; margin-top:4px; letter-spacing:.08em; text-transform:uppercase; }
    .dlp-head-actions { display:flex; gap:8px; }
    .dlp-icon-btn { border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.08); color:#fff; width:39px; height:39px; border-radius:12px; display:grid; place-items:center; }
    .dlp-icon-btn:hover { background:rgba(255,255,255,.16); }
    .dlp-icon-btn svg { width:18px; height:18px; }
    .dlp-tabs-wrap { background:rgba(255,255,255,.95); border-bottom:1px solid var(--dlp-line); position:sticky; top:0; z-index:10; box-shadow:0 5px 18px rgba(26,44,63,.06); }
    .dlp-tabs { max-width:1120px; margin:auto; display:flex; align-items:stretch; gap:6px; padding:9px 14px 8px; overflow-x:auto; scrollbar-width:none; }
    .dlp-tabs::-webkit-scrollbar { display:none; }
    .dlp-tab { flex:0 0 auto; min-width:80px; border:0; background:transparent; color:var(--dlp-muted); border-radius:13px; padding:9px 12px 8px; display:grid; gap:3px; justify-items:center; font-size:10px; font-weight:750; white-space:nowrap; transition:.2s; }
    .dlp-tab svg { width:17px; height:17px; }
    .dlp-tab.active { color:var(--dlp-navy); background:#e9f2f1; box-shadow:inset 0 -2px var(--dlp-coral); }
    .dlp-tab.card-tab.active { background:#fff0ec; }

    .dlp-hero { background:var(--dlp-navy); color:#fff; border-radius:25px; padding:22px; box-shadow:var(--dlp-shadow); position:relative; overflow:hidden; }
    .dlp-hero::before { content:""; position:absolute; width:360px; height:360px; right:-195px; bottom:-245px; border:1px solid rgba(255,255,255,.18); border-radius:50%; box-shadow:0 0 0 24px rgba(255,255,255,.025), 0 0 0 48px rgba(255,255,255,.025); }
    .dlp-hero-top { display:flex; justify-content:space-between; align-items:start; position:relative; z-index:1; }
    .dlp-overline { color:#a7c4d3; text-transform:uppercase; font-size:10px; font-weight:800; letter-spacing:.16em; }
    .dlp-hero h1 { font-family:Georgia, "Times New Roman", serif; font-size:clamp(29px, 4vw, 45px); line-height:1.01; letter-spacing:-.06em; font-weight:500; margin:9px 0 6px; }
    .dlp-hero-intro { color:#b5c4d2; font-size:12px; line-height:1.48; margin:0; max-width:470px; }
    .dlp-hero-grid { display:grid; grid-template-columns:1fr 1.25fr; gap:10px; margin-top:20px; position:relative; z-index:1; }
    .dlp-state { border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.065); padding:14px; border-radius:17px; min-width:0; }
    .dlp-state.next { background:var(--dlp-coral); border-color:transparent; color:var(--dlp-navy); }
    .dlp-state-label { font-size:9px; text-transform:uppercase; letter-spacing:.14em; font-weight:850; opacity:.72; }
    .dlp-state-time { font-size:clamp(25px, 4vw, 34px); font-weight:800; letter-spacing:-.07em; margin:7px 0 2px; line-height:1; }
    .dlp-state-name { font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:750; }
    .dlp-state-meta { display:flex; gap:5px; align-items:center; margin-top:7px; font-size:10px; opacity:.68; }
    .dlp-state-meta svg { width:12px; height:12px; }
    .dlp-state-empty { font-size:12px; line-height:1.3; margin-top:10px; opacity:.72; }
    .dlp-summary { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:14px 0 28px; }
    .dlp-stat { background:var(--dlp-paper); border:1px solid var(--dlp-line); border-radius:17px; padding:13px; }
    .dlp-stat strong { display:block; font-size:22px; letter-spacing:-.06em; line-height:1; }
    .dlp-stat span { display:block; color:var(--dlp-muted); font-size:10px; margin-top:5px; }
    .dlp-section-head { display:flex; align-items:end; justify-content:space-between; gap:12px; margin:0 2px 12px; }
    .dlp-section-head h2 { font-family:Georgia, "Times New Roman", serif; font-size:24px; letter-spacing:-.045em; font-weight:500; margin:0; }
    .dlp-section-head p { color:var(--dlp-muted); font-size:11px; margin:4px 0 0; }
    .dlp-filter-row { display:flex; gap:6px; overflow-x:auto; margin-bottom:11px; scrollbar-width:none; }
    .dlp-filter-row::-webkit-scrollbar { display:none; }
    .dlp-filter { border:1px solid var(--dlp-line); background:rgba(255,255,255,.7); color:var(--dlp-muted); border-radius:20px; padding:7px 11px; font-size:10px; font-weight:750; white-space:nowrap; }
    .dlp-filter.active { background:var(--dlp-navy); color:#fff; border-color:var(--dlp-navy); }
    .dlp-history { background:var(--dlp-paper); border:1px solid var(--dlp-line); border-radius:20px; overflow:hidden; }
    .dlp-history-row { display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:11px; align-items:center; padding:14px; border-bottom:1px solid #edf1f1; cursor:pointer; }
    .dlp-history-row:last-child { border-bottom:0; }
    .dlp-history-row:hover { background:#fbfcfc; }
    .dlp-history-time { align-self:start; text-align:center; border-radius:11px; background:#eef4f4; padding:7px 4px 6px; color:var(--dlp-navy); font-weight:850; font-size:12px; line-height:1.05; }
    .dlp-history-time small { display:block; color:var(--dlp-muted); font-weight:650; font-size:8px; margin-top:3px; }
    .dlp-history-copy { min-width:0; }
    .dlp-history-copy strong { display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dlp-history-copy span { display:block; color:var(--dlp-muted); font-size:10px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dlp-badge { display:inline-flex; align-items:center; gap:4px; padding:5px 7px; border-radius:8px; background:#f0f2f3; color:#7d8791; font-size:9px; font-weight:800; white-space:nowrap; }
    .dlp-badge.next { background:#fff0ec; color:var(--dlp-coral-dark); }
    .dlp-badge.latest { background:#e8f6ee; color:#3b7c60; }
    .dlp-history-empty { padding:30px 18px; text-align:center; color:var(--dlp-muted); font-size:12px; }
    .dlp-card-detail { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .dlp-detail-main { background:var(--dlp-paper); border:1px solid var(--dlp-line); border-radius:22px; padding:20px; }
    .dlp-detail-side { display:grid; align-content:start; gap:14px; }
    .dlp-detail-head { display:flex; align-items:start; justify-content:space-between; gap:12px; }
    .dlp-detail-head h2 { font-family:Georgia, "Times New Roman", serif; font-size:32px; line-height:1; font-weight:500; letter-spacing:-.06em; margin:8px 0 7px; }
    .dlp-detail-area { color:var(--dlp-muted); font-size:11px; }
    .dlp-detail-actions { display:flex; gap:6px; }
    .dlp-round-btn { width:35px; height:35px; border-radius:11px; border:1px solid var(--dlp-line); background:#fff; color:var(--dlp-muted); display:grid; place-items:center; }
    .dlp-round-btn:hover { color:var(--dlp-navy); background:#f2f7f6; }
    .dlp-round-btn svg { width:16px; height:16px; }
    .dlp-ticket { margin:22px 0 18px; border-radius:18px; background:var(--dlp-navy); color:#fff; padding:19px; position:relative; overflow:hidden; }
    .dlp-ticket::before, .dlp-ticket::after { content:""; position:absolute; width:18px; height:18px; background:var(--dlp-bg); border-radius:50%; top:50%; transform:translateY(-50%); }
    .dlp-ticket::before { left:-10px; }
    .dlp-ticket::after { right:-10px; }
    .dlp-ticket-label { color:#a8bfd0; text-transform:uppercase; letter-spacing:.15em; font-size:9px; font-weight:850; }
    .dlp-ticket-time { font-size:47px; letter-spacing:-.09em; font-weight:850; margin-top:7px; line-height:1; }
    .dlp-ticket-date { color:#c6d0da; font-size:11px; margin-top:6px; }
    .dlp-detail-note { background:#f3f7f6; border-radius:14px; color:var(--dlp-muted); font-size:11px; line-height:1.45; padding:13px; }
    .dlp-action-row { display:flex; gap:8px; margin-top:15px; }
    .dlp-primary, .dlp-secondary, .dlp-danger { min-height:42px; border-radius:12px; padding:0 14px; font-size:11px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; gap:7px; }
    .dlp-primary { border:1px solid var(--dlp-navy); background:var(--dlp-navy); color:#fff; flex:1; }
    .dlp-secondary { border:1px solid var(--dlp-line); background:#fff; color:var(--dlp-ink); }
    .dlp-danger { border:1px solid #f0cbc5; background:#fff8f6; color:var(--dlp-coral-dark); }
    .dlp-card-management { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; padding-top:15px; border-top:1px solid var(--dlp-line); }
    .dlp-card-management button { min-height:38px; padding:0 11px; font-size:10px; }
    .dlp-card-management svg { width:14px; height:14px; }
    .dlp-primary:hover { background:#213d5e; }
    .dlp-primary svg, .dlp-secondary svg { width:15px; height:15px; }
    .dlp-side-panel { background:var(--dlp-paper); border:1px solid var(--dlp-line); border-radius:20px; padding:17px; }
    .dlp-side-panel h3 { font-family:Georgia, "Times New Roman", serif; font-size:20px; font-weight:500; letter-spacing:-.04em; margin:0 0 12px; }
    .dlp-toggle-line { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:11px; }
    .dlp-toggle-line span { color:var(--dlp-muted); }
    .dlp-switch { width:42px; height:24px; border:0; border-radius:99px; padding:3px; background:#ccd4d8; transition:.2s; }
    .dlp-switch i { display:block; width:18px; height:18px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 4px rgba(0,0,0,.15); }
    .dlp-switch.on { background:#50b986; }
    .dlp-switch.on i { transform:translateX(18px); }
    .dlp-mini-list { display:grid; gap:9px; }
    .dlp-mini-item { display:flex; align-items:center; gap:9px; font-size:11px; }
    .dlp-mini-dot { width:8px; height:8px; border-radius:50%; background:var(--dlp-coral); flex:0 0 auto; }
    .dlp-mini-item span { color:var(--dlp-muted); margin-left:auto; font-size:10px; }
    .dlp-fab { position:fixed; right:18px; bottom:20px; z-index:15; border:0; border-radius:15px; background:var(--dlp-coral); color:var(--dlp-navy); box-shadow:0 10px 25px rgba(217,82,79,.28); min-height:46px; padding:0 16px; font-size:12px; font-weight:900; display:flex; align-items:center; gap:7px; }
    .dlp-fab svg { width:17px; height:17px; }
    .dlp-sheet-backdrop { position:fixed; inset:0; z-index:30; display:flex; align-items:end; justify-content:center; background:rgba(16,36,61,.5); backdrop-filter:blur(5px); }
    .dlp-sheet-backdrop.hidden { display:none; }
    .dlp-sheet { width:min(560px, 100%); background:var(--dlp-paper); border-radius:24px 24px 0 0; padding:20px 18px max(20px, env(safe-area-inset-bottom)); box-shadow:0 -15px 50px rgba(17,34,55,.22); }
    .dlp-sheet-handle { width:34px; height:4px; border-radius:99px; background:#d4dcdd; margin:0 auto 16px; }
    .dlp-sheet-head { display:flex; justify-content:space-between; gap:12px; align-items:start; margin-bottom:17px; }
    .dlp-sheet-head h2 { font-family:Georgia, "Times New Roman", serif; font-weight:500; font-size:27px; letter-spacing:-.05em; margin:0; }
    .dlp-sheet-head p { color:var(--dlp-muted); font-size:11px; margin:5px 0 0; }
    .dlp-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .dlp-field { display:grid; gap:6px; }
    .dlp-field.full { grid-column:1/-1; }
    .dlp-field label { color:var(--dlp-muted); font-size:10px; font-weight:800; }
    .dlp-field input { height:45px; border:1px solid var(--dlp-line); border-radius:12px; background:#fbfcfc; color:var(--dlp-ink); padding:0 12px; outline:none; }
    .dlp-field input:focus { border-color:var(--dlp-coral); box-shadow:0 0 0 3px rgba(255,115,95,.14); }
    .dlp-check { display:flex; align-items:center; gap:8px; color:var(--dlp-ink); font-size:11px; margin:15px 0 18px; }
    .dlp-check input { width:17px; height:17px; accent-color:var(--dlp-coral-dark); }
    .dlp-form-actions { display:flex; gap:8px; justify-content:flex-end; }
    .dlp-form-actions button { min-height:43px; border-radius:12px; padding:0 15px; font-size:11px; font-weight:800; }
    .dlp-form-cancel { border:1px solid var(--dlp-line); background:#fff; color:var(--dlp-ink); }
    .dlp-form-save { border:1px solid var(--dlp-navy); background:var(--dlp-navy); color:#fff; }
    .dlp-toast { position:fixed; left:50%; bottom:80px; z-index:40; transform:translate(-50%, 12px); opacity:0; pointer-events:none; background:var(--dlp-navy); color:#fff; border-radius:13px; padding:12px 15px; box-shadow:0 12px 28px rgba(16,36,61,.25); font-size:11px; transition:.22s; white-space:nowrap; }
    .dlp-toast.show { opacity:1; transform:translate(-50%, 0); }
    @media (min-width: 780px) {
      #dlpApp { padding-bottom:0; }
      .dlp-header { padding-left:30px; padding-right:30px; }
      .dlp-tabs { padding-left:30px; padding-right:30px; }
      .dlp-main { padding:28px 30px 65px; }
      .dlp-fab { right:35px; bottom:28px; }
      .dlp-sheet-backdrop { align-items:center; }
      .dlp-sheet { border-radius:24px; padding:25px; }
      .dlp-toast { bottom:28px; }
    }
    @media (max-width: 570px) {
      .dlp-header-inner { align-items:start; }
      .dlp-brand-name { font-size:21px; }
      .dlp-head-actions .dlp-icon-btn:last-child { display:none; }
      .dlp-hero { padding:19px; }
      .dlp-hero-grid { gap:8px; }
      .dlp-state { padding:12px; }
      .dlp-state-meta { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .dlp-card-detail { display:block; }
      .dlp-detail-side { margin-top:14px; }
      .dlp-detail-head h2 { font-size:29px; }
    }
    @media (max-width: 390px) {
      .dlp-tabs { padding-left:8px; padding-right:8px; }
      .dlp-tab { min-width:72px; padding-left:8px; padding-right:8px; }
      .dlp-main { padding-left:11px; padding-right:11px; }
      .dlp-summary { gap:7px; }
      .dlp-stat { padding:11px 9px; }
      .dlp-stat strong { font-size:20px; }
      .dlp-history-row { padding:12px 10px; gap:8px; }
      .dlp-badge { padding-left:5px; padding-right:5px; }
    }
    @media (prefers-reduced-motion: reduce) { #dlpApp *, #dlpApp *::before, #dlpApp *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <div id="dlpApp">
    <header class="dlp-header">
      <div class="dlp-header-inner">
        <div class="dlp-brand">
          <div class="dlp-stamp">DLP</div>
          <div><div class="dlp-brand-name">DLP Priority</div><div class="dlp-brand-sub">Dein Rückkehrplan · Disneyland Paris</div></div>
        </div>
        <div class="dlp-head-actions">
          <button class="dlp-icon-btn" id="dlpNotifyBtn" aria-label="Benachrichtigungen aktivieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg></button>
          <button class="dlp-icon-btn" id="dlpHeaderAdd" aria-label="Neue Rückkehrzeit hinzufügen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
    </header>
    <nav class="dlp-tabs-wrap" aria-label="DLP Priority Karten">
      <div class="dlp-tabs" id="dlpTabs"></div>
    </nav>
    <main class="dlp-main">
      <section class="dlp-panel" id="dlpOverviewPanel"></section>
      <section class="dlp-panel dlp-hidden" id="dlpCardPanel"></section>
    </main>
    <button class="dlp-fab" id="dlpFab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Neue Zeit</button>
    <div class="dlp-sheet-backdrop hidden" id="dlpSheetBackdrop">
      <section class="dlp-sheet" role="dialog" aria-modal="true" aria-labelledby="dlpSheetTitle">
        <div class="dlp-sheet-handle"></div>
        <div class="dlp-sheet-head"><div><h2 id="dlpSheetTitle">Neue Rückkehrzeit</h2><p id="dlpSheetSub">Trag die Zeit direkt von der Priority-Karte ein.</p></div><button class="dlp-round-btn" id="dlpCloseSheet" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <form id="dlpForm">
          <div class="dlp-form-grid">
            <div class="dlp-field full" id="dlpCardNameField"><label for="dlpCardNameInput">Name der Karte</label><input id="dlpCardNameInput" placeholder="z. B. Familie oder Dominik" /></div>
            <div class="dlp-field full" id="dlpCardSelectField"><label for="dlpCardSelect">Priority-Karte</label><select id="dlpCardSelect"></select></div>
            <div class="dlp-field full" id="dlpEntryFields"><label for="dlpAttractionInput">Name der Attraktion</label><input id="dlpAttractionInput" placeholder="z. B. Peter Pan’s Flight" /></div>
            <div class="dlp-field" id="dlpDateField"><label for="dlpDateInput">Datum</label><input id="dlpDateInput" type="date" /></div>
            <div class="dlp-field" id="dlpTimeField"><label for="dlpTimeInput">Rückkehrzeit</label><input id="dlpTimeInput" type="time" /></div>
          </div>
          <label class="dlp-check" id="dlpReminderRow"><input id="dlpReminderInput" type="checkbox" checked /> Mich zur Rückkehrzeit benachrichtigen</label>
          <div class="dlp-form-actions"><button type="button" class="dlp-form-cancel" id="dlpCancelSheet">Abbrechen</button><button type="submit" class="dlp-form-save" id="dlpSaveBtn">Zeit speichern</button></div>
        </form>
      </section>
    </div>
    <div class="dlp-toast" id="dlpToast" role="status"></div>
  </div>
  <script>
    (() => {
      const DLP_TODAY = '2026-08-30';
      const DLP_PREVIEW_NOW = '2026-08-30T14:30:00';
      const dlpIcon = {
        home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9Z"/></svg>',
        card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',
        plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>',
        bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg>',
        bellOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-9.8-4.6M6 8c0 7-3 7-3 9h15M10 21h4M3 3l18 18"/></svg>',
        edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 16-.8 4.8L8 20l11-11a2.8 2.8 0 0 0-4-4L4 16Z"/><path d="m13.5 6.5 4 4"/></svg>',
        trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
        pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.3"/></svg>',
        arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
        clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>'
      };
      let dlpCards = [
        { id:'family', name:'Familie', entries:[
          { id:'f1', attraction:'Dumbo the Flying Elephant', park:'Fantasyland', date:DLP_TODAY, time:'12:05', reminder:false },
          { id:'f2', attraction:'Peter Pan’s Flight', park:'Fantasyland', date:DLP_TODAY, time:'14:20', reminder:true, current:true }
        ]},
        { id:'dominik', name:'Dominik', entries:[
          { id:'d1', attraction:'Ratatouille: The Adventure', park:'Worlds of Pixar', date:DLP_TODAY, time:'13:10', reminder:true },
          { id:'d2', attraction:'Big Thunder Mountain', park:'Frontierland', date:DLP_TODAY, time:'15:05', reminder:true, next:true }
        ]},
        { id:'gemeinsam', name:'Gemeinsam', entries:[
          { id:'g1', attraction:'Buzz Lightyear Laser Blast', park:'Discoveryland', date:DLP_TODAY, time:'16:10', reminder:true }
        ]}
      ];
      let dlpActiveTab = 'overview';
      let dlpFilter = 'all';
      let dlpSheetMode = 'entry';
      let dlpEditingCardId = null;
      let dlpEditingEntryId = null;
      let dlpToastTimer;
      const $ = id => document.getElementById(id);
      const escapeHtml = value => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      const entryDate = entry => new Date(entry.date + 'T' + entry.time + ':00');
      const entryStamp = entry => entry.date + 'T' + entry.time + ':00';
      const allEntries = () => dlpCards.flatMap(card => card.entries.map(entry => ({...entry, cardId:card.id, cardName:card.name})));
      const previewNow = () => new Date(DLP_PREVIEW_NOW);
      const nextEntry = () => allEntries().filter(entry => entryDate(entry) > previewNow()).sort((a,b) => entryDate(a)-entryDate(b))[0] || null;
      const latestEntry = () => allEntries().filter(entry => entry.current).sort((a,b) => entryDate(b)-entryDate(a))[0] || allEntries().filter(entry => entryDate(entry) <= previewNow()).sort((a,b) => entryDate(b)-entryDate(a))[0] || null;
      const stateOf = entry => {
        const next = nextEntry();
        if (entry.current) return 'current';
        if (entryDate(entry) <= previewNow()) return 'past';
        if (next && next.id === entry.id) return 'next';
        return 'upcoming';
      };
      const stateLabel = state => ({current:'Aktuellste', past:'Vergangen', next:'Als Nächstes', upcoming:'Geplant'})[state];
      const niceDate = date => new Date(date + 'T12:00:00').toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'short'}).replace('.', '');
      const countdown = entry => {
        const mins = Math.round((entryDate(entry) - previewNow()) / 60000);
        if (mins < 0) return 'vor ' + Math.abs(mins) + ' Min.';
        if (mins === 0) return 'Jetzt';
        if (mins < 60) return 'in ' + mins + ' Min.';
        const hours = Math.floor(mins / 60);
        return 'in ' + hours + ' Std. ' + (mins % 60) + ' Min.';
      };
      const showToast = text => { $('dlpToast').textContent = text; $('dlpToast').classList.add('show'); clearTimeout(dlpToastTimer); dlpToastTimer = setTimeout(() => $('dlpToast').classList.remove('show'), 2600); };
      const findCard = id => dlpCards.find(card => card.id === id);
      const findEntry = (cardId, entryId) => { const card = findCard(cardId); return card && card.entries.find(entry => entry.id === entryId); };
      const sortedEntries = entries => [...entries].sort((a,b) => entryDate(b)-entryDate(a));
      function tabMarkup(id, label, icon, active, add = false) { return `<button class="dlp-tab ${active ? 'active ' : ''}${add ? 'add-tab' : 'card-tab'}" data-dlp-tab="${id}" aria-current="${active ? 'page' : 'false'}">${icon}<span>${escapeHtml(label)}</span></button>`; }
      function renderTabs() {
        $('dlpTabs').innerHTML = tabMarkup('overview','Übersicht',dlpIcon.home,dlpActiveTab === 'overview') + dlpCards.map(card => tabMarkup(card.id, card.name, dlpIcon.card, dlpActiveTab === card.id)).join('') + tabMarkup('new-card','Karte +',dlpIcon.plus,false,true);
        document.querySelectorAll('[data-dlp-tab]').forEach(button => button.addEventListener('click', () => { const tab = button.dataset.dlpTab; if (tab === 'new-card') return openSheet('card'); dlpActiveTab = tab; render(); }));
      }
      function stateBadge(entry) { const state = stateOf(entry); return `<span class="dlp-badge ${state === 'next' ? 'next' : state === 'current' ? 'latest' : ''}">${stateLabel(state)}</span>`; }
      function historyRow(entry, showCard = true) {
        const state = stateOf(entry);
        return `<div class="dlp-history-row" data-dlp-open-card="${entry.cardId}">
          <div class="dlp-history-time">${escapeHtml(entry.time)}<small>${escapeHtml(niceDate(entry.date).split(',')[0])}</small></div>
          <div class="dlp-history-copy"><strong>${escapeHtml(entry.attraction)}</strong><span>${showCard ? escapeHtml(entry.cardName) + ' · ' : ''}${escapeHtml(entry.park || 'Disneyland Paris')} · ${escapeHtml(niceDate(entry.date))}</span></div>
          ${stateBadge(entry)}
        </div>`;
      }
      function renderOverview() {
        const all = allEntries();
        const latest = latestEntry();
        const next = nextEntry();
        const past = sortedEntries(all.filter(entry => stateOf(entry) === 'past'));
        const filtered = dlpFilter === 'all' ? sortedEntries(all) : dlpFilter === 'past' ? past : sortedEntries(all.filter(entry => ['next','upcoming'].includes(stateOf(entry))));
        const activeCards = new Set(all.filter(entry => ['current','next','upcoming'].includes(stateOf(entry))).map(entry => entry.cardId)).size;
        $('dlpOverviewPanel').innerHTML = `
          <div class="dlp-dayline"><span>Parktag · Sonntag, 30. August 2026</span><span class="dlp-live"><i></i>${activeCards} aktive Karten</span></div>
          <section class="dlp-hero"><div class="dlp-hero-top"><div><div class="dlp-overline">Deine Parkübersicht</div><h1>Immer wissen,<br>wo du hinmusst.</h1><p class="dlp-hero-intro">DLP Priority sammelt jede Rückkehrzeit an einem Ort – auch wenn du mit mehreren Karten unterwegs bist.</p></div></div>
            <div class="dlp-hero-grid">
              <div class="dlp-state">${latest ? `<div class="dlp-state-label">Aktuellste Karte</div><div class="dlp-state-time">${escapeHtml(latest.time)}</div><div class="dlp-state-name">${escapeHtml(latest.attraction)}</div><div class="dlp-state-meta">${dlpIcon.card}${escapeHtml(latest.cardName)} · ${escapeHtml(countdown(latest))}</div>` : '<div class="dlp-state-label">Aktuellste Karte</div><div class="dlp-state-empty">Noch keine Rückkehrzeit eingetragen.</div>'}</div>
              <div class="dlp-state next">${next ? `<div class="dlp-state-label">Als Nächstes</div><div class="dlp-state-time">${escapeHtml(next.time)}</div><div class="dlp-state-name">${escapeHtml(next.attraction)}</div><div class="dlp-state-meta">${dlpIcon.card}${escapeHtml(next.cardName)} · ${escapeHtml(countdown(next))}</div>` : '<div class="dlp-state-label">Als Nächstes</div><div class="dlp-state-empty">Keine weitere Zeit geplant.</div>'}</div>
            </div>
          </section>
          <div class="dlp-summary"><div class="dlp-stat"><strong>${past.length}</strong><span>vergangene Zeiten</span></div><div class="dlp-stat"><strong>${all.filter(entry => ['next','upcoming'].includes(stateOf(entry))).length}</strong><span>geplante Zeiten</span></div><div class="dlp-stat"><strong>${dlpCards.length}</strong><span>Priority-Karten</span></div></div>
          <div class="dlp-section-head"><div><h2>Alle Zeiten</h2><p>Vergangene, aktuelle und geplante Rückkehrzeiten.</p></div></div>
          <div class="dlp-filter-row"><button class="dlp-filter ${dlpFilter === 'all' ? 'active' : ''}" data-dlp-filter="all">Alle Zeiten</button><button class="dlp-filter ${dlpFilter === 'past' ? 'active' : ''}" data-dlp-filter="past">Vergangen</button><button class="dlp-filter ${dlpFilter === 'planned' ? 'active' : ''}" data-dlp-filter="planned">Geplant</button></div>
          <div class="dlp-history">${filtered.length ? filtered.map(entry => historyRow(entry, true)).join('') : '<div class="dlp-history-empty">Hier erscheinen deine Zeiten, sobald du eine Priority-Karte einträgst.</div>'}</div>
        `;
        document.querySelectorAll('[data-dlp-filter]').forEach(button => button.addEventListener('click', () => { dlpFilter = button.dataset.dlpFilter; renderOverview(); }));
        document.querySelectorAll('[data-dlp-open-card]').forEach(row => row.addEventListener('click', () => { dlpActiveTab = row.dataset.dlpOpenCard; render(); }));
      }
      function cardActiveEntry(card) {
        return card.entries.filter(entry => ['current','next','upcoming'].includes(stateOf(entry))).sort((a,b) => entryDate(a)-entryDate(b))[0] || null;
      }
      function renderCard(card) {
        const active = cardActiveEntry(card);
        const history = sortedEntries(card.entries.filter(entry => stateOf(entry) === 'past'));
        const upcoming = sortedEntries(card.entries.filter(entry => ['next','upcoming'].includes(stateOf(entry))));
        $('dlpCardPanel').innerHTML = `
          <div class="dlp-dayline"><span>Priority-Karte · ${escapeHtml(card.name)}</span><span class="dlp-live"><i></i>${card.entries.length} ${card.entries.length === 1 ? 'Zeit' : 'Zeiten'}</span></div>
          <div class="dlp-card-detail"><section class="dlp-detail-main"><div class="dlp-detail-head"><div><div class="dlp-overline">Meine Priority-Karte</div><h2>${escapeHtml(card.name)}</h2><div class="dlp-detail-area">${dlpIcon.card} Mehrere Rückkehrzeiten auf dieser Karte</div></div><div class="dlp-detail-actions"><button class="dlp-round-btn" data-dlp-add-entry="${card.id}" aria-label="Zeit hinzufügen">${dlpIcon.plus}</button></div></div>
            ${active ? `<div class="dlp-ticket"><div class="dlp-ticket-label">${stateOf(active) === 'current' ? 'Aktuellste Rückkehrzeit' : 'Nächste Rückkehrzeit'}</div><div class="dlp-ticket-time">${escapeHtml(active.time)}</div><div class="dlp-ticket-date">${escapeHtml(niceDate(active.date))} · ${escapeHtml(active.attraction)}</div></div><div class="dlp-detail-note">${stateOf(active) === 'current' ? 'Diese Karte wurde zuletzt aktualisiert. Deine nächste geplante Zeit findest du direkt darunter.' : 'Das ist die nächste Rückkehrzeit auf dieser Karte. Du kannst sie jederzeit ändern oder löschen.'}</div><div class="dlp-action-row"><button class="dlp-primary" data-dlp-edit="${card.id}|${active.id}">${dlpIcon.edit}Zeit bearbeiten</button><button class="dlp-secondary" data-dlp-toggle="${card.id}|${active.id}">${active.reminder ? dlpIcon.bell : dlpIcon.bellOff}${active.reminder ? 'Erinnerung an' : 'Erinnerung aus'}</button></div>` : '<div class="dlp-history-empty" style="margin-top:25px;">Auf dieser Karte ist noch keine Zeit eingetragen.</div>'}
            <div class="dlp-card-management"><button class="dlp-secondary" data-dlp-rename="${card.id}">${dlpIcon.edit}Karte umbenennen</button><button class="dlp-danger" data-dlp-delete-card="${card.id}">${dlpIcon.trash}Karte löschen</button></div>
          </section><aside class="dlp-detail-side"><section class="dlp-side-panel"><h3>Als Nächstes</h3><div class="dlp-mini-list">${upcoming.length ? upcoming.slice(0,3).map(entry => `<div class="dlp-mini-item"><i class="dlp-mini-dot"></i><b>${escapeHtml(entry.time)}</b><div style="min-width:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(entry.attraction)}</div><span>${escapeHtml(countdown(entry))}</span></div>`).join('') : '<div class="dlp-history-empty" style="padding:10px 0;">Keine weiteren Zeiten geplant.</div>'}</div></section><section class="dlp-side-panel"><h3>Vergangene Zeiten</h3><div class="dlp-history">${history.length ? history.map(entry => historyRow(entry, false)).join('') : '<div class="dlp-history-empty">Noch keine vergangene Zeit.</div>'}</div></section></aside></div>
        `;
        document.querySelectorAll('[data-dlp-add-entry]').forEach(button => button.addEventListener('click', () => openSheet('entry', button.dataset.dlpAddEntry)));
        document.querySelectorAll('[data-dlp-edit]').forEach(button => button.addEventListener('click', () => { const [cardId, entryId] = button.dataset.dlpEdit.split('|'); openSheet('entry', cardId, entryId); }));
        document.querySelectorAll('[data-dlp-toggle]').forEach(button => button.addEventListener('click', () => { const [cardId, entryId] = button.dataset.dlpToggle.split('|'); const entry = findEntry(cardId, entryId); entry.reminder = !entry.reminder; showToast(entry.reminder ? 'Erinnerung eingeschaltet' : 'Erinnerung ausgeschaltet'); renderCard(findCard(cardId)); }));
        document.querySelectorAll('[data-dlp-rename]').forEach(button => button.addEventListener('click', () => { const card = findCard(button.dataset.dlpRename); const name = prompt('Wie soll die Karte heißen?', card.name); if (name && name.trim() && name.trim() !== card.name) { card.name = name.trim(); showToast('Karte umbenannt'); render(); } }));
        document.querySelectorAll('[data-dlp-delete-card]').forEach(button => button.addEventListener('click', () => { const card = findCard(button.dataset.dlpDeleteCard); if (!card) return; if (confirm('Die Karte „' + card.name + '“ und alle zugehörigen Zeiten löschen?')) { dlpCards = dlpCards.filter(item => item.id !== card.id); dlpActiveTab = 'overview'; render(); showToast('Karte gelöscht'); } }));
        document.querySelectorAll('[data-dlp-open-card]').forEach(row => row.addEventListener('click', () => {}));
      }
      function render() {
        renderTabs();
        if (dlpActiveTab === 'overview') { $('dlpOverviewPanel').classList.remove('dlp-hidden'); $('dlpCardPanel').classList.add('dlp-hidden'); renderOverview(); }
        else { const card = findCard(dlpActiveTab) || dlpCards[0]; if (card) { $('dlpOverviewPanel').classList.add('dlp-hidden'); $('dlpCardPanel').classList.remove('dlp-hidden'); renderCard(card); } }
      }
      function fillCardSelect(selected) { $('dlpCardSelect').innerHTML = dlpCards.map(card => `<option value="${escapeHtml(card.id)}" ${card.id === selected ? 'selected' : ''}>${escapeHtml(card.name)}</option>`).join(''); }
      function openSheet(mode = 'entry', cardId = null, entryId = null) {
        dlpSheetMode = mode; dlpEditingCardId = cardId; dlpEditingEntryId = entryId;
        const isCard = mode === 'card'; const isEdit = Boolean(entryId);
        $('dlpSheetTitle').textContent = isCard ? 'Neue Priority-Karte' : isEdit ? 'Rückkehrzeit bearbeiten' : 'Neue Rückkehrzeit';
        $('dlpSheetSub').textContent = isCard ? 'Eine eigene Karte für Familie, Team oder eine weitere Person.' : isEdit ? 'Ändere Attraktion, Datum, Zeit oder Erinnerung.' : 'Trag die Zeit direkt von der Priority-Karte ein.';
        $('dlpCardNameField').classList.toggle('dlp-hidden', !isCard);
        $('dlpCardSelectField').classList.toggle('dlp-hidden', isCard || isEdit);
        $('dlpEntryFields').classList.toggle('dlp-hidden', isCard);
        $('dlpDateInput').classList.toggle('dlp-hidden', isCard);
        $('dlpTimeInput').classList.toggle('dlp-hidden', isCard);
        $('dlpReminderRow').classList.toggle('dlp-hidden', isCard);
        $('dlpSaveBtn').textContent = isCard ? 'Karte anlegen' : isEdit ? 'Änderungen speichern' : 'Zeit speichern';
        $('dlpCardNameInput').value = isCard ? '' : '';
        $('dlpAttractionInput').value = '';
        $('dlpDateInput').value = DLP_TODAY;
        $('dlpTimeInput').value = '';
        $('dlpReminderInput').checked = true;
        fillCardSelect(cardId || (dlpActiveTab !== 'overview' ? dlpActiveTab : dlpCards[0]?.id));
        if (isEdit) { const entry = findEntry(cardId, entryId); if (entry) { $('dlpAttractionInput').value = entry.attraction; $('dlpDateInput').value = entry.date; $('dlpTimeInput').value = entry.time; $('dlpReminderInput').checked = entry.reminder; } }
        $('dlpSheetBackdrop').classList.remove('hidden');
        setTimeout(() => $(isCard ? 'dlpCardNameInput' : 'dlpAttractionInput').focus(), 40);
      }
      function closeSheet() { $('dlpSheetBackdrop').classList.add('hidden'); dlpEditingCardId = null; dlpEditingEntryId = null; }
      $('dlpForm').addEventListener('submit', event => {
        event.preventDefault();
        if (dlpSheetMode === 'card') {
          const name = $('dlpCardNameInput').value.trim();
          if (!name) { $('dlpCardNameInput').focus(); showToast('Bitte einen Kartennamen eingeben'); return; }
          const id = 'card-' + Date.now(); dlpCards.push({id, name, entries:[]}); dlpActiveTab = id; closeSheet(); render(); showToast('Priority-Karte angelegt'); return;
        }
        const cardId = dlpEditingCardId || $('dlpCardSelect').value; const card = findCard(cardId); const attraction = $('dlpAttractionInput').value.trim();
        if (!card || !attraction || !$('dlpDateInput').value || !$('dlpTimeInput').value) return;
        const values = {attraction, date:$('dlpDateInput').value, time:$('dlpTimeInput').value, reminder:$('dlpReminderInput').checked, park:'Disneyland Paris'};
        if (dlpEditingEntryId) { const entry = findEntry(cardId, dlpEditingEntryId); Object.assign(entry, values); entry.current = false; showToast('Rückkehrzeit aktualisiert'); }
        else { card.entries.push({id:'entry-' + Date.now(), ...values}); showToast('Rückkehrzeit hinzugefügt'); }
        closeSheet(); dlpActiveTab = cardId; render();
      });
      $('dlpFab').addEventListener('click', () => openSheet('entry', dlpActiveTab !== 'overview' ? dlpActiveTab : null));
      $('dlpHeaderAdd').addEventListener('click', () => openSheet('entry', dlpActiveTab !== 'overview' ? dlpActiveTab : null));
      $('dlpCloseSheet').addEventListener('click', closeSheet); $('dlpCancelSheet').addEventListener('click', closeSheet); $('dlpSheetBackdrop').addEventListener('click', event => { if (event.target === $('dlpSheetBackdrop')) closeSheet(); });
      $('dlpNotifyBtn').addEventListener('click', async () => { if (!('Notification' in window)) { showToast('Benachrichtigungen sind in dieser Vorschau nicht verfügbar'); return; } const permission = await Notification.requestPermission(); if (permission === 'granted') { new Notification('DLP Priority', {body:'Erinnerungen sind aktiviert.'}); showToast('Benachrichtigungen aktiviert'); } else showToast('Bitte Benachrichtigungen im Browser erlauben'); });
      render();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
